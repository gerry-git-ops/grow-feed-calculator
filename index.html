<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="utf-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#030712">
    <title>Grow Feed Calculator</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="app">
        <header class="app-header">
            <div class="app-controls">
                <select id="language" class="input input-small" data-i18n-label="label.language"></select>
                <button id="theme" class="icon-button" type="button" data-i18n-label="theme.toggle"></button>
            </div>
            <img class="app-logo" src="assets/logo.webp" alt="" width="900" height="600">
            <h1 class="app-title" data-i18n="app.title"></h1>
        </header>

        <section class="card">
            <div class="field-row">
                <div class="field">
                    <label for="brand" class="label" data-i18n="label.brand"></label>
                    <select id="brand" class="input"></select>
                </div>
                <div class="field">
                    <label for="schedule" class="label" data-i18n="label.schedule"></label>
                    <select id="schedule" class="input"></select>
                </div>
            </div>
            <fieldset id="phase" class="choice-group">
                <legend class="label" data-i18n="label.phase"></legend>
            </fieldset>

            <div class="field">
                <label for="week" class="label" data-i18n="label.week"></label>
                <select id="week" class="input"></select>
            </div>

            <ul id="schedule-notes" class="schedule-notes"></ul>
        </section>

        <section class="card">
            <div class="field">
                <label for="water" class="label" data-i18n="label.water"></label>
                <div class="input-row">
                    <input id="water" class="input" type="text" inputmode="decimal"
                        data-i18n-placeholder="water.placeholder">
                    <select id="water-unit" class="input input-unit">
                        <option value="ml" data-i18n="unit.ml"></option>
                        <option value="l" data-i18n="unit.l"></option>
                    </select>
                </div>
            </div>

            <div id="optional" class="options"></div>
        </section>

        <section id="result-card" class="card" hidden>
            <p id="water-info" class="water-info"></p>
            <ul id="result" class="dose-list"></ul>
        </section>

        <footer class="app-footer">
            <details class="changelog">
                <summary id="version" class="version"></summary>
                <h2 class="label" data-i18n="footer.changes"></h2>
                <div id="changelog" class="changelog-list"></div>
            </details>
        </footer>
    </main>

    <script type="module" src="src/app.js"></script>
</body>

</html>
